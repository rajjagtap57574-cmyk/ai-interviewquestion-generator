<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | Raj Jagtap CSE-AIML</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>


<body class="auth-page">


    <!-- TOP BAR -->

    <div class="exporter-banner">

        <div class="exporter-info">

            <i class="fa-solid fa-graduation-cap"></i>

            <span>
                <strong>Raj Jagtap</strong> — CSE-AIML
            </span>

        </div>


        <div class="export-btn-group">

            <a href="index.html"
               class="btn-code-modal auth-top-btn">

                <i class="fa-solid fa-house"></i>
                Home

            </a>


            <a href="login.html"
               class="btn-export auth-top-btn">

                <i class="fa-solid fa-right-to-bracket"></i>
                Login

            </a>

        </div>

    </div>



    <!-- REGISTER SECTION -->

    <main class="auth-main">

        <section class="glass-card auth-card">


            <div class="ai-badge">

                <i class="fa-solid fa-user-plus"></i>

                Create Account

            </div>


            <h1>
                Create Your Account
            </h1>


            <p class="auth-subtitle">

                Register to start your
                AI interview practice.

            </p>



            <!-- REGISTER FORM -->

            <form id="registerForm"
                  class="auth-form">


                <!-- NAME -->

                <label>

                    Full Name

                    <input
                        id="registerName"
                        type="text"
                        placeholder="Enter your full name"
                        required>

                </label>



                <!-- EMAIL -->

                <label>

                    Email

                    <input
                        id="registerEmail"
                        type="email"
                        placeholder="Enter your email"
                        required>

                </label>



                <!-- PASSWORD -->

                <label>

                    Password

                    <input
                        id="registerPassword
