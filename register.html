<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | Raj Jagtap CSE-AIML</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>


<body class="auth-page">


    <!-- TOP BAR -->

    <div class="exporter-banner">

        <div class="exporter-info">

            <i class="fa-solid fa-graduation-cap"></i>

            <span>
                <strong>Raj Jagtap</strong> — CSE-AIML
            </span>

        </div>


        <div class="export-btn-group">

            <a href="index.html"
               class="btn-code-modal auth-top-btn">

                <i class="fa-solid fa-house"></i>
                Home

            </a>


            <a href="login.html"
               class="btn-export auth-top-btn">

                <i class="fa-solid fa-right-to-bracket"></i>
                Login

            </a>

        </div>

    </div>



    <!-- REGISTER SECTION -->

    <main class="auth-main">

        <section class="glass-card auth-card">


            <div class="ai-badge">

                <i class="fa-solid fa-user-plus"></i>

                Create Account

            </div>


            <h1>
                Create Your Account
            </h1>


            <p class="auth-subtitle">

                Register to start your
                AI interview practice.

            </p>



            <!-- REGISTER FORM -->

            <form id="registerForm"
                  class="auth-form">


                <!-- NAME -->

                <label>

                    Full Name

                    <input
                        id="registerName"
                        type="text"
                        placeholder="Enter your full name"
                        required>

                </label>



                <!-- EMAIL -->

                <label>

                    Email

                    <input
                        id="registerEmail"
                        type="email"
                        placeholder="Enter your email"
                        required>

                </label>



               <!-- PASSWORD -->

<label>

    Password

    <input
        id="registerPassword"
        type="password"
        minlength="6"
        placeholder="Minimum 6 characters"
        required>

</label>


<!-- CONFIRM PASSWORD -->

<label>

    Confirm Password

    <input
        id="registerConfirm"
        type="password"
        minlength="6"
        placeholder="Re-enter your password"
        required>

</label>


<!-- CREATE ACCOUNT BUTTON -->

<button
    class="btn btn-primary"
    type="submit">

    <i class="fa-solid fa-user-plus"></i>

    Create Account

</button>

</form>


<!-- MESSAGE -->

<div id="registerMessage"
     class="auth-message">
</div>


<!-- LOGIN LINK -->

<p class="auth-switch">

    Already have an account?

    <a href="login.html">
        Login here
    </a>

</p>

</section>

</main>


<!-- FOOTER -->

<footer>

    <p>
        © 2026 Raj Jagtap CSE-AIML —
        AI Interview Question Generator.
    </p>

</footer>


<script>

document
    .getElementById("registerForm")
    .addEventListener("submit", function(e) {

        e.preventDefault();

        const name =
            document.getElementById("registerName").value.trim();

        const email =
            document.getElementById("registerEmail").value.trim().toLowerCase();

        const password =
            document.getElementById("registerPassword").value;

        const confirm =
            document.getElementById("registerConfirm").value;

        const message =
            document.getElementById("registerMessage");


        if (password !== confirm) {

            message.textContent =
                "Passwords do not match.";

            message.style.color = "#f87171";

            return;
        }


        const user = {
            name: name,
            email: email,
            password: password
        };


        localStorage.setItem(
            "interviewAIUser",
            JSON.stringify(user)
        );


        localStorage.setItem(
            "interviewAILoggedIn",
            "true"
        );


        message.textContent =
            "Registration successful!";

        message.style.color = "#34d399";


        setTimeout(function() {

            window.location.href = "index.html";

        }, 1000);

    });

</script>


</body>

</html>
